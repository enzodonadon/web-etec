<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <h1>Catálogo de Produtos</h1>
            <form action="" method="get">
                <label for="fsearch" class="form-item">Pesquisar</label>
                <input type="search" name="q" id="fsearch" placeholder="ex: notebook" class="form-item">
                <button type="submit" class="btn-search form-item">Buscar</button>
            </form>
            <ul id="catalog"></ul>
        </section>
    </main>

    <script>
        const produtos = [
            ["Samsung", "Galaxy Book4", "Core i5, 8GB RAM, SSD 512GB", "R$ 3.300", "notebook"],
            ["Lenovo", "IdeaPad Slim 3", "Core i5, 8GB RAM, SSD 512GB", "R$ 3.100", "notebook"],
            ["ASUS", "Vivobook 15", "Core i5, 8GB RAM, SSD 512GB", "R$ 3.000", "notebook"],
            ["Acer", "Aspire 5", "Core i5, 8GB RAM, SSD 256GB", "R$ 2.800", "notebook"],
            ["Dell", "Inspiron 15", "Core i5, 8GB RAM, SSD 512GB", "R$ 3.400", "notebook"],
            ["VAIO", "FE16", "Core i5, 16GB RAM, SSD 512GB", "R$ 3.200", "notebook"],
            ["Apple", "MacBook Air M2", "Chip M2, 8GB RAM, SSD 256GB", "R$ 6.800", "notebook"],
            ["Apple", "iPhone 15", "128GB, Tela 6.1\", Câmera 48MP", "R$ 4.800", "celular"],
            ["Samsung", "Galaxy S24", "128GB, 8GB RAM, Tela 6.2\"", "R$ 4.200", "celular"],
            ["Motorola", "Edge 50 Pro", "256GB, 12GB RAM, Tela 6.7\"", "R$ 3.100", "celular"],
            ["Xiaomi", "Redmi Note 13", "256GB, 8GB RAM, Tela 6.67\"", "R$ 1.400", "celular"],
            ["Apple", "iPad Air M2", "128GB, Tela 11\", Wi-Fi", "R$ 5.300", "tablet"],
            ["Samsung", "Galaxy Tab S9 FE", "128GB, 6GB RAM, Tela 10.9\"", "R$ 2.600", "tablet"],
            ["Sony", "PlayStation 5", "SSD 825GB, Controle DualSense", "R$ 3.700", "videogame"],
            ["Microsoft", "Xbox Series X", "SSD 1TB, 4K HDR", "R$ 4.100", "videogame"],
            ["Nintendo", "Switch OLED", "64GB, Tela 7\" OLED", "R$ 2.100", "videogame"],
            ["LG", "Smart TV OLED55C3", "55\", 4K, 120Hz, HDMI 2.1", "R$ 5.500", "televisão"],
            ["Samsung", "Smart TV QLED Q60C", "50\", 4K, Modo Game", "R$ 2.700", "televisão"],
            ["Apple", "Watch Series 9", "GPS, Caixa de Alumínio 45mm", "R$ 3.200", "relógio"],
            ["Samsung", "Galaxy Watch 6", "BT 44mm, Monitor Cardíaco", "R$ 1.500", "relógio"],
            ["JBL", "Boombox 3", "80W RMS, Bluetooth, IP67", "R$ 2.300", "caixa de som"],
            ["Sony", "WH-1000XM5", "Fone Bluetooth, Cancelamento de Ruído", "R$ 2.200", "fone"],
            ["Apple", "AirPods Pro (2ª Geração)", "Cancelamento Ativo de Ruído, MagSafe", "R$ 1.800", "fone"],
            ["Canon", "EOS Rebel T7", "Lente 18-55mm, 24.1MP, Wi-Fi", "R$ 2.900", "câmera"],
            ["Logitech", "G Pro X Superlight", "Mouse Gamer Sem Fio, 25K DPI", "R$ 700", "mouse"],
            ["Razer", "BlackWidow V4", "Teclado Mecânico RGB, Switch Green", "R$ 1.100", "teclado"],
            ["Amazon", "Kindle Paperwhite", "16GB, Tela 6.8\", À Prova D'água", "R$ 750", "leitor digital"]
        ];

        const catalogo = document.querySelector('#catalog');

        function mostrar(lista) {
            catalogo.innerHTML = ""; 

            for (let i = 0; i < lista.length; i++) {
                const marca = lista[i][0];
                const modelo = lista[i][1];
                const specs = lista[i][2];
                const preco = lista[i][3];

                const item = document.createElement('li');
                item.innerHTML = `<strong><h3 class="product-info">${marca}</h3></strong> <br><p class="product-info">${modelo}</p><br> <p class="product-info">${preco}</p>`;
                item.setAttribute('class', 'item');
                catalogo.appendChild(item);
            }
        }

        mostrar(produtos);

        const form = document.querySelector('form');

        form.addEventListener('submit', function (evento) {
            evento.preventDefault(); // impede o formulário de recarregar a página
            
            const busca = document.getElementById('fsearch').value.toLowerCase();

            const produtos_filtrados = produtos.filter(function (produto) {
                return produto.some(function (campo) {   // .some() verifica se existe ao menos campo neste produto
                    return campo.toString().toLowerCase().includes(busca);
                });
            });

            mostrar(produtos_filtrados);
        });
    </script>
</body>
</html>
